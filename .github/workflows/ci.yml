name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit (${{ matrix.service }})
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/services/${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service: [browse, booking, payment]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

  integration:
    name: Compose integration
    needs: [backend-unit, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Build and start stack
        run: HOLD_TTL_SECONDS=2 docker compose up --build -d

      - name: Wait for application
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8080/health >/dev/null; then
              curl -fsS http://localhost:8080/ >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "CinemaSeat did not become healthy" >&2
          exit 1

      - name: Run application integration tests
        run: pytest -q tests/integration

      - name: Run gateway control-header tests
        run: python tests/gateway_control_headers.py

      - name: Show service logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
