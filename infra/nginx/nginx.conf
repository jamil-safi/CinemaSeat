events {}

http {
  upstream browse_api { server browse:8000; }
  upstream booking_api { server booking:8000; }
  upstream payment_api { server payment:8000; }

  server {
    listen 80;
    client_max_body_size 1m;
    root /usr/share/nginx/html;

    location = /health {
      proxy_pass http://booking_api/health/live;
    }

    location ~ ^/api/v1/showtimes/[0-9]+/seats$ {
      proxy_pass http://booking_api;
    }
    location /api/v1/holds { proxy_pass http://booking_api; }
    location /api/v1/bookings { proxy_pass http://booking_api; }

    location /api/v1/movies { proxy_pass http://browse_api; }
    location /api/v1/theatres { proxy_pass http://browse_api; }
    location /api/v1/showtimes { proxy_pass http://browse_api; }

    location /api/v1/otp { proxy_pass http://payment_api; }
    location = /api/v1/payments/gateway/callback { proxy_pass http://payment_api; }

    location /api/ {
      default_type application/json;
      return 404 '{"detail":"not found"}';
    }

    location = / {
      try_files /index.html =404;
    }

    location ~* \.(?:css|js)$ {
      try_files $uri =404;
      expires 1h;
      add_header Cache-Control "public, max-age=3600";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
